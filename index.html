<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교실 속 4채널 루퍼 - 엽쌤스쿨</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --beatbox-bg: #ffb3ba;
            --bass-bg: #bae1ff;
            --chorus-bg: #baffc9;
            --melody-bg: #ffffba;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; text-align: center; }

        h1 { margin-bottom: 5px; font-size: 28px; font-weight: 800; color: #2c3e50; }
        .notice { font-size: 14px; color: #e74c3c; margin-bottom: 20px; font-weight: bold; }
        .unsupported {
            display: none; max-width: 800px; margin: 0 auto 20px; padding: 12px 16px;
            background: #fff3cd; color: #856404; border-radius: 12px; font-weight: bold; font-size: 14px;
        }

        .top-controls {
            background: white; padding: 15px 20px; border-radius: 30px;
            display: inline-flex; align-items: center; gap: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 10px; flex-wrap: wrap; justify-content: center;
        }

        .bpm-control { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .bpm-control select { font-size: 14px; font-weight: bold; padding: 4px 8px; border-radius: 8px; border: 1px solid #ccc; }
        input[type="range"] { cursor: pointer; }
        input:disabled, select:disabled { cursor: not-allowed; opacity: 0.5; }
        .lock-hint { font-size: 13px; color: #7f8c8d; margin-bottom: 30px; min-height: 18px; }

        .grid-container {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;
            max-width: 800px; margin: 0 auto;
        }

        .pad {
            padding: 20px; border-radius: 20px; box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            display: flex; flex-direction: column; align-items: center; position: relative;
        }

        .pad h2 { font-size: 20px; margin-bottom: 4px; color: rgba(0,0,0,0.8); }
        .pad .status { font-size: 13px; font-weight: bold; color: rgba(0,0,0,0.55); margin-bottom: 8px; min-height: 18px; }
        .is-recording .status { color: #c0392b; }

        .pad.beatbox { background-color: var(--beatbox-bg); }
        .pad.bass { background-color: var(--bass-bg); }
        .pad.chorus { background-color: var(--chorus-bg); }
        .pad.melody { background-color: var(--melody-bg); }

        canvas {
            width: 100%; height: 60px; background: rgba(255,255,255,0.4);
            border-radius: 12px; margin-bottom: 10px;
        }

        .volume-control {
            display: flex; align-items: center; gap: 8px; margin-bottom: 15px;
            font-size: 14px; width: 100%; padding: 0 10px;
        }
        .volume-control input[type="range"] { flex-grow: 1; accent-color: #333; }

        .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

        button {
            border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold;
            font-size: 14px; cursor: pointer; transition: all 0.2s;
        }
        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.35; filter: grayscale(0.8); cursor: not-allowed; }
        button:disabled:active { transform: none; }

        .btn-record { background: #ff4757; color: white; }
        .btn-stop { background: #2f3542; color: white; }
        .pad:not(.is-recording) .btn-stop { display: none; }   /* 취소는 녹음 중에만 표시 */
        .btn-play { background: #1e90ff; color: white; }
        .btn-delete { background: #747d8c; color: white; }
        .btn-metro { background: #ffa502; color: white; padding: 10px 20px; }
        .btn-download { background: #8e44ad; color: white; padding: 10px 20px; }

        .global-controls { margin-top: 40px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .btn-global-play { background: #2ed573; color: white; font-size: 16px; padding: 15px 30px; border-radius: 30px; }
        .btn-global-stop { background: #ff6b81; color: white; font-size: 16px; padding: 15px 30px; border-radius: 30px; }

        .recording-indicator {
            position: absolute; top: 20px; right: 20px; width: 12px; height: 12px;
            background: #ff4757; border-radius: 50%; display: none;
            animation: pulse 1s infinite;
        }
        .is-recording .recording-indicator { display: block; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        footer { margin-top: 50px; padding-bottom: 20px; color: #95a5a6; font-weight: bold; font-size: 15px; }


        /* 따라 하기 가이드 카드 */
        .guide {
            width: 100%; background: rgba(255,255,255,0.55); border-radius: 12px;
            padding: 8px 10px; margin-bottom: 10px; font-size: 13px;
        }
        .guide-tip { color: rgba(0,0,0,0.65); margin-bottom: 6px; font-weight: 600; }
        .guide-row { display: flex; align-items: center; gap: 4px; margin-top: 3px; }
        .guide-label { flex: 0 0 52px; font-size: 12px; font-weight: bold; color: rgba(0,0,0,0.55); text-align: left; }
        .guide-cells { flex: 1; display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
        .guide-cell {
            height: 26px; line-height: 26px; border-radius: 6px; font-weight: 800; font-size: 13px;
            background: rgba(255,255,255,0.6); color: #2c3e50;
        }
        .guide-cell.rest { color: rgba(0,0,0,0.2); }
        .guide-cell.beat { box-shadow: inset 0 -2px 0 rgba(0,0,0,0.12); }
        .guide-cell.now { background: #2c3e50; color: white; }
        .guide-note { font-size: 11px; color: rgba(0,0,0,0.45); margin-top: 4px; }

        .btn-example { background: #16a085; color: white; }
        .btn-solo { background: #e67e22; color: white; }

        /* 릴레이: 다음 녹음 차례 */
        .pad.next-turn { outline: 3px dashed rgba(0,0,0,0.35); outline-offset: 3px; }

        /* 빠진 파트 찾기 퀴즈 */
        .btn-quiz { background: #6c5ce7; color: white; font-size: 16px; padding: 15px 30px; border-radius: 30px; }
        .quiz {
            display: none; max-width: 800px; margin: 25px auto 0; background: white; border-radius: 20px;
            padding: 20px; box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        }
        .quiz.active { display: block; }
        .quiz h3 { font-size: 20px; margin-bottom: 8px; }
        .quiz-msg { font-size: 16px; font-weight: bold; margin-bottom: 14px; min-height: 22px; }
        .quiz-options { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
        .quiz-options button { font-size: 16px; padding: 12px 20px; color: #2c3e50; }
        .quiz-options button.wrong { text-decoration: line-through; }
        .quiz-options button.right { outline: 3px solid #2ed573; }
        .quiz-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn-quiz-next { background: #6c5ce7; color: white; }
        .btn-quiz-end { background: #b2bec3; color: white; }
        .quiz-score { margin-top: 12px; font-size: 14px; color: #7f8c8d; font-weight: bold; }
        .quiz-mode .pad canvas { visibility: hidden; }

        @media (max-width: 600px) {
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <h1>🎤 교실 속 4채널 루퍼</h1>
    <p class="notice">💡 녹음 시 유선 이어폰을 꼭 착용해주세요! (스피커 소리가 들어가면 하울링이 발생하고, 블루투스 이어폰은 박자가 밀립니다)</p>
    <p class="unsupported" id="unsupported">⚠️ 이 브라우저는 녹음을 지원하지 않습니다. 최신 크롬, 사파리, 엣지에서 열어주세요.</p>

    <div class="top-controls">
        <div class="bpm-control">
            BPM: <span id="bpmValue">120</span>
            <input type="range" id="bpmSlider" min="60" max="180" value="120">
        </div>
        <div class="bpm-control">
            길이:
            <select id="barsSelect">
                <option value="2">2마디</option>
                <option value="4" selected>4마디</option>
                <option value="8">8마디</option>
            </select>
        </div>
        <button class="btn-metro" id="metroToggle">메트로놈 켜기 ⏱️</button>
        <button class="btn-download" id="btn-download" onclick="downloadMix()">음원(.wav) 다운로드 💾</button>
    </div>
    <p class="lock-hint" id="lockHint"></p>

    <div class="grid-container">
        <!-- Beatbox -->
        <div class="pad beatbox" id="pad-beatbox">
            <div class="recording-indicator"></div>
            <h2>🥁 비트박스</h2>
            <div class="status"></div>
            <div class="guide" id="guide-beatbox"></div>
            <canvas id="canvas-beatbox"></canvas>
            <div class="volume-control">
                🔊 <input type="range" id="vol-beatbox" min="0" max="1" step="0.05" value="1" oninput="changeVolume('beatbox', this.value)">
            </div>
            <div class="controls">
                <button class="btn-record" onclick="startRecording('beatbox')">녹음 🔴</button>
                <button class="btn-stop" onclick="cancelRecording()" disabled>취소 ⬛</button>
                <button class="btn-play" onclick="playTrack('beatbox')" disabled>재생 ▶️</button>
                <button class="btn-delete" onclick="deleteTrack('beatbox')" disabled>삭제 🗑️</button>
                <button class="btn-example" onclick="toggleExample('beatbox')">예시 듣기 👂</button>
                <button class="btn-solo" onclick="soloTrack('beatbox')" disabled>솔로 🎧</button>
            </div>
        </div>

        <!-- Bass -->
        <div class="pad bass" id="pad-bass">
            <div class="recording-indicator"></div>
            <h2>🎸 베이스</h2>
            <div class="status"></div>
            <div class="guide" id="guide-bass"></div>
            <canvas id="canvas-bass"></canvas>
            <div class="volume-control">
                🔊 <input type="range" id="vol-bass" min="0" max="1" step="0.05" value="1" oninput="changeVolume('bass', this.value)">
            </div>
            <div class="controls">
                <button class="btn-record" onclick="startRecording('bass')">녹음 🔴</button>
                <button class="btn-stop" onclick="cancelRecording()" disabled>취소 ⬛</button>
                <button class="btn-play" onclick="playTrack('bass')" disabled>재생 ▶️</button>
                <button class="btn-delete" onclick="deleteTrack('bass')" disabled>삭제 🗑️</button>
                <button class="btn-example" onclick="toggleExample('bass')">예시 듣기 👂</button>
                <button class="btn-solo" onclick="soloTrack('bass')" disabled>솔로 🎧</button>
            </div>
        </div>

        <!-- Chorus -->
        <div class="pad chorus" id="pad-chorus">
            <div class="recording-indicator"></div>
            <h2>👥 화음(코러스)</h2>
            <div class="status"></div>
            <div class="guide" id="guide-chorus"></div>
            <canvas id="canvas-chorus"></canvas>
            <div class="volume-control">
                🔊 <input type="range" id="vol-chorus" min="0" max="1" step="0.05" value="1" oninput="changeVolume('chorus', this.value)">
            </div>
            <div class="controls">
                <button class="btn-record" onclick="startRecording('chorus')">녹음 🔴</button>
                <button class="btn-stop" onclick="cancelRecording()" disabled>취소 ⬛</button>
                <button class="btn-play" onclick="playTrack('chorus')" disabled>재생 ▶️</button>
                <button class="btn-delete" onclick="deleteTrack('chorus')" disabled>삭제 🗑️</button>
                <button class="btn-example" onclick="toggleExample('chorus')">예시 듣기 👂</button>
                <button class="btn-solo" onclick="soloTrack('chorus')" disabled>솔로 🎧</button>
            </div>
        </div>

        <!-- Melody -->
        <div class="pad melody" id="pad-melody">
            <div class="recording-indicator"></div>
            <h2>🎵 메인 멜로디</h2>
            <div class="status"></div>
            <div class="guide" id="guide-melody"></div>
            <canvas id="canvas-melody"></canvas>
            <div class="volume-control">
                🔊 <input type="range" id="vol-melody" min="0" max="1" step="0.05" value="1" oninput="changeVolume('melody', this.value)">
            </div>
            <div class="controls">
                <button class="btn-record" onclick="startRecording('melody')">녹음 🔴</button>
                <button class="btn-stop" onclick="cancelRecording()" disabled>취소 ⬛</button>
                <button class="btn-play" onclick="playTrack('melody')" disabled>재생 ▶️</button>
                <button class="btn-delete" onclick="deleteTrack('melody')" disabled>삭제 🗑️</button>
                <button class="btn-example" onclick="toggleExample('melody')">예시 듣기 👂</button>
                <button class="btn-solo" onclick="soloTrack('melody')" disabled>솔로 🎧</button>
            </div>
        </div>
    </div>

    <div class="global-controls">
        <button class="btn-global-play" id="btn-global-play" onclick="playAll()">전체 동시 재생 🌟</button>
        <button class="btn-global-stop" onclick="stopAll()">전체 정지 ✋</button>
        <button class="btn-quiz" id="btn-quiz" onclick="startQuiz()" disabled>빠진 파트 찾기 퀴즈 🕵️</button>
    </div>

    <div class="quiz" id="quiz">
        <h3>🕵️ 빠진 파트 찾기</h3>
        <p class="quiz-msg" id="quiz-msg"></p>
        <div class="quiz-options" id="quiz-options"></div>
        <div class="quiz-actions">
            <button class="btn-quiz-next" id="quiz-next" onclick="nextQuestion()">다음 문제 ➡️</button>
            <button class="btn-quiz-end" onclick="endQuiz()">퀴즈 끝내기</button>
        </div>
        <p class="quiz-score" id="quiz-score"></p>
    </div>

    <footer>Made by. 엽쌤</footer>

    <script>
        const parts = ['beatbox', 'bass', 'chorus', 'melody'];
        const BEATS_PER_BAR = 4;
        const MIX_REPEATS = 4;          // 다운로드 음원에 루프를 몇 번 반복할지
        const LOOKAHEAD = 0.1;          // 메트로놈 예약 구간(초)

        const buffers = { beatbox: null, bass: null, chorus: null, melody: null };  // 녹음된 AudioBuffer
        const peaks = { beatbox: null, bass: null, chorus: null, melody: null };    // 파형 미리보기
        const sources = { beatbox: null, bass: null, chorus: null, melody: null };  // 재생 중인 소스
        const gains = {};

        let audioCtx, master;
        let bpm = 120;
        let bars = 4;

        // 박자 기준점: 루프(및 메트로놈 1박)가 시작되는 AudioContext 시각
        let clockOrigin = 0;
        let transportRunning = false;

        let isMetronomeOn = false;
        let metroTimer = null;
        let nextBeatIndex = 0;

        // 녹음 상태
        let mic = null;        // { stream, source, analyser, capture }
        let rec = null;        // { part, countInStart, startTime, startFrame, data, filled, forceClick }
        let workletReady = null;

        const isSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
                               (window.AudioContext || window.webkitAudioContext));

        const bpmSlider = document.getElementById('bpmSlider');
        const bpmValue = document.getElementById('bpmValue');
        const barsSelect = document.getElementById('barsSelect');
        const metroToggle = document.getElementById('metroToggle');

        const beatDur = () => 60 / bpm;
        const barDur = () => beatDur() * BEATS_PER_BAR;
        const loopDur = () => barDur() * bars;
        const hasAnyTrack = () => parts.some(p => buffers[p]);

        bpmSlider.addEventListener('input', (e) => {
            bpm = Number(e.target.value);
            bpmValue.textContent = bpm;
            if (isMetronomeOn && !transportRunning) resetClock(audioCtx.currentTime + 0.05);
            saveSettings();
        });

        barsSelect.addEventListener('change', (e) => {
            bars = Number(e.target.value);
            buildGuides();
            saveSettings();
        });

        metroToggle.addEventListener('click', toggleMetronome);

        function initAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                // 4개 파트를 합쳐도 소리가 깨지지 않도록 컴프레서를 거쳐 출력
                const comp = audioCtx.createDynamicsCompressor();
                comp.threshold.value = -6;
                comp.ratio.value = 8;
                master = audioCtx.createGain();
                master.connect(comp);
                comp.connect(audioCtx.destination);
                parts.forEach(part => {
                    gains[part] = audioCtx.createGain();
                    gains[part].gain.value = document.getElementById(`vol-${part}`).value;
                    gains[part].connect(master);
                });
            }
            // iOS/Safari 정책 상 User Gesture 직후에 AudioContext Resume 필요
            if (audioCtx.state === 'suspended') audioCtx.resume();
            setAudioSession(mic ? 'play-and-record' : 'playback');
        }

        // iOS 17+ : 무음 스위치가 켜져 있어도 소리가 나도록 오디오 세션 지정
        function setAudioSession(type) {
            try { if (navigator.audioSession) navigator.audioSession.type = type; } catch (e) {}
        }

        // --- 메트로놈 (AudioContext 시계 기준으로 예약해서 박이 밀리지 않음) ---
        function scheduleClick(time, accent) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);   // 메트로놈은 믹스(다운로드)에 들어가지 않음

            // 1박(강박)은 높은 소리로 구분
            osc.frequency.setValueAtTime(accent ? 1500 : 800, time);
            osc.frequency.exponentialRampToValueAtTime(100, time + 0.1);

            gain.gain.setValueAtTime(accent ? 1 : 0.6, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);

            osc.start(time);
            osc.stop(time + 0.1);
        }

        function shouldClick(time) {
            if (isMetronomeOn) return true;
            if (!rec) return false;
            if (time < rec.startTime) return true;   // 카운트인은 항상 들려줌
            return rec.forceClick;                   // 첫 트랙 녹음 시에는 박자 기준이 필요
        }

        function resetClock(origin) {
            clockOrigin = origin;
            nextBeatIndex = Math.ceil((audioCtx.currentTime - clockOrigin) / beatDur() - 1e-6);
        }

        function metroTick() {
            const until = audioCtx.currentTime + LOOKAHEAD;
            while (true) {
                const t = clockOrigin + nextBeatIndex * beatDur();
                if (t >= until) break;
                if (t >= audioCtx.currentTime - 0.01 && shouldClick(t)) {
                    const beatInBar = ((nextBeatIndex % BEATS_PER_BAR) + BEATS_PER_BAR) % BEATS_PER_BAR;
                    scheduleClick(Math.max(t, audioCtx.currentTime), beatInBar === 0);
                }
                nextBeatIndex++;
            }
        }

        function updateMetroTimer() {
            const needed = isMetronomeOn || !!rec;
            if (needed && !metroTimer) {
                metroTick();
                metroTimer = setInterval(metroTick, 25);
            } else if (!needed && metroTimer) {
                clearInterval(metroTimer);
                metroTimer = null;
            }
        }

        function toggleMetronome() {
            initAudioCtx();
            isMetronomeOn = !isMetronomeOn;
            if (isMetronomeOn) {
                if (!transportRunning && !rec) resetClock(audioCtx.currentTime + 0.05);
                metroToggle.textContent = '메트로놈 끄기 🛑';
                metroToggle.style.background = '#ff4757';
            } else {
                metroToggle.textContent = '메트로놈 켜기 ⏱️';
                metroToggle.style.background = '#ffa502';
            }
            updateMetroTimer();
        }

        // --- 재생 (Web Audio: 모든 파트가 같은 시각에 시작하고 무한 반복) ---
        function startSource(part, when, offset) {
            const src = audioCtx.createBufferSource();
            src.buffer = buffers[part];
            src.loop = true;
            src.connect(gains[part]);
            src.start(when, offset);
            sources[part] = src;
        }

        function stopSource(part) {
            if (sources[part]) {
                try { sources[part].stop(); } catch (e) {}
                sources[part].disconnect();
                sources[part] = null;
            }
        }

        function startTransport(when, partList) {
            resetClock(when);
            transportRunning = true;
            partList.forEach(part => startSource(part, when, 0));
        }

        function stopTransport() {
            parts.forEach(stopSource);
            transportRunning = false;
        }

        function changeVolume(part, val) {
            if (gains[part]) gains[part].gain.value = val;
        }

        // 파트 재생 버튼: 이미 반복 재생 중이면 박자에 맞춰 그 파트를 켜고/끔
        function playTrack(part) {
            if (!buffers[part] || rec || quiz) return;
            initAudioCtx();
            if (sources[part]) {
                stopSource(part);
                if (!parts.some(p => sources[p])) transportRunning = false;
            } else if (transportRunning) {
                const when = audioCtx.currentTime + 0.02;
                const offset = ((when - clockOrigin) % loopDur() + loopDur()) % loopDur();
                startSource(part, when, offset);
            } else {
                startTransport(audioCtx.currentTime + 0.05, [part]);
            }
            updateUI();
        }

        function playAll() {
            if (rec || quiz || !hasAnyTrack()) return;
            initAudioCtx();
            stopTransport();
            stopAllExamples();
            startTransport(audioCtx.currentTime + 0.05, parts.filter(p => buffers[p]));
            updateUI();
        }

        function stopAll() {
            if (rec) cancelRecording();
            if (quiz) endQuiz();
            stopAllExamples();
            stopTransport();
            updateUI();
        }

        function deleteTrack(part) {
            if (rec || quiz) return;
            if (!confirm('이 파트의 녹음을 삭제할까요?')) return;
            stopSource(part);
            if (!parts.some(p => sources[p])) transportRunning = false;
            buffers[part] = null;
            peaks[part] = null;
            dbDelete(part);
            updateUI();
        }

        // --- 녹음 ---
        const CAPTURE_WORKLET = `
            class CaptureProcessor extends AudioWorkletProcessor {
                constructor() { super(); this.on = false; this.port.onmessage = e => { this.on = e.data; }; }
                process(inputs) {
                    const ch = inputs[0] && inputs[0][0];
                    if (this.on && ch) this.port.postMessage({ frame: currentFrame, data: ch.slice(0) });
                    return true;
                }
            }
            registerProcessor('capture-processor', CaptureProcessor);`;

        async function createCaptureNode() {
            if (audioCtx.audioWorklet) {
                try {
                    if (!workletReady) {
                        const url = URL.createObjectURL(new Blob([CAPTURE_WORKLET], { type: 'application/javascript' }));
                        workletReady = audioCtx.audioWorklet.addModule(url);
                    }
                    await workletReady;
                    const node = new AudioWorkletNode(audioCtx, 'capture-processor', { numberOfOutputs: 1 });
                    node.port.onmessage = e => onCaptured(e.data.frame, e.data.data);
                    return { node, setOn: on => node.port.postMessage(on) };
                } catch (e) {
                    console.warn('AudioWorklet 사용 불가, ScriptProcessor로 대체합니다.', e);
                    workletReady = null;
                }
            }
            // 구형 브라우저용 대체 방식
            const size = 2048;
            const node = audioCtx.createScriptProcessor(size, 1, 1);
            let on = false;
            node.onaudioprocess = e => {
                if (!on) return;
                const frame = Math.round(e.playbackTime * audioCtx.sampleRate) - size;
                onCaptured(frame, e.inputBuffer.getChannelData(0).slice(0));
            };
            return { node, setOn: v => { on = v; } };
        }

        async function openMic() {
            if (mic) return mic;
            let stream;
            try {
                // 통화용 음성 처리(에코·잡음 제거, 자동 음량)는 비트박스와 저음을 깎으므로 끔
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
                });
            } catch (err) {
                alert("마이크 접근 권한이 필요합니다! 설정에서 권한을 허용해주세요.");
                console.error(err);
                return null;
            }
            setAudioSession('play-and-record');
            const source = audioCtx.createMediaStreamSource(stream);
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);

            const capture = await createCaptureNode();
            const silent = audioCtx.createGain();
            silent.gain.value = 0;
            source.connect(capture.node);
            capture.node.connect(silent);
            silent.connect(audioCtx.destination);

            mic = { stream, source, analyser, capture, silent };
            return mic;
        }

        // 녹음이 끝나면 마이크를 꺼서 브라우저의 마이크 사용 표시를 없앰
        function closeMic() {
            if (!mic) return;
            mic.capture.setOn(false);
            mic.source.disconnect();
            mic.capture.node.disconnect();
            mic.silent.disconnect();
            mic.stream.getTracks().forEach(t => t.stop());
            mic = null;
            setAudioSession('playback');
        }

        async function startRecording(part) {
            if (rec || quiz || !isSupported) return;
            if (buffers[part] && !confirm('이미 녹음된 파트입니다. 다시 녹음할까요?')) return;
            initAudioCtx();
            stopTransport();
            stopAllExamples();

            const m = await openMic();
            if (!m) return;

            const others = parts.filter(p => p !== part && buffers[p]);
            const countInStart = audioCtx.currentTime + 0.1;
            const startTime = countInStart + barDur();       // 1마디 카운트인 뒤 녹음 시작

            // 들리는 소리(출력 지연)에 맞춰 부른 목소리가 다시 들어오기까지(입력 지연)의 시간만큼 보정
            const trackLatency = m.stream.getAudioTracks()[0].getSettings().latency || 0;
            const latency = (audioCtx.outputLatency || 0) + (audioCtx.baseLatency || 0) + trackLatency;
            const sr = audioCtx.sampleRate;

            rec = {
                part, countInStart, startTime,
                startFrame: Math.round((startTime + latency) * sr),
                data: new Float32Array(Math.round(loopDur() * sr)),
                filled: 0,
                forceClick: others.length === 0,
            };

            // 다른 파트는 녹음 시작 시각에 맞춰 반복 재생 (오버더빙)
            startTransport(startTime, others);
            m.capture.setOn(true);
            updateMetroTimer();
            updateUI();
        }

        function onCaptured(frame, chunk) {
            if (!rec) return;
            const from = Math.max(frame, rec.startFrame);
            const to = Math.min(frame + chunk.length, rec.startFrame + rec.data.length);
            if (to > from) {
                rec.data.set(chunk.subarray(from - frame, to - frame), from - rec.startFrame);
                rec.filled = to - rec.startFrame;
            }
            if (rec.filled >= rec.data.length) finishRecording();
        }

        function finishRecording() {
            const { part, data } = rec;
            const buffer = audioCtx.createBuffer(1, data.length, audioCtx.sampleRate);
            buffer.copyToChannel(data, 0);
            setTrack(part, buffer);
            dbSave(part, data, audioCtx.sampleRate);
            endRecording();
        }

        function cancelRecording() {
            if (!rec) return;
            endRecording();
        }

        function endRecording() {
            rec = null;
            closeMic();
            stopTransport();
            if (isMetronomeOn) resetClock(audioCtx.currentTime + 0.05);
            updateMetroTimer();
            updateUI();
        }

        function setTrack(part, buffer) {
            buffers[part] = buffer;
            const data = buffer.getChannelData(0);
            const bins = 120, step = Math.floor(data.length / bins) || 1;
            const p = new Float32Array(bins);
            for (let i = 0; i < bins; i++) {
                let max = 0;
                for (let j = i * step, end = Math.min(data.length, (i + 1) * step); j < end; j++) {
                    const v = Math.abs(data[j]);
                    if (v > max) max = v;
                }
                p[i] = max;
            }
            peaks[part] = p;
        }

        // --- 화면 상태 ---
        function updateUI() {
            const any = hasAnyTrack();
            parts.forEach(part => {
                const pad = document.getElementById(`pad-${part}`);
                const recordingThis = rec && rec.part === part;
                pad.classList.toggle('is-recording', !!recordingThis);
                const busy = !!rec || !!quiz;
                pad.classList.toggle('next-turn', !busy && part === nextTurnPart());
                pad.querySelector('.btn-record').disabled = !isSupported || busy;
                pad.querySelector('.btn-stop').disabled = !recordingThis;
                const playBtn = pad.querySelector('.btn-play');
                playBtn.disabled = !buffers[part] || busy;
                playBtn.textContent = sources[part] && !busy ? '멈춤 ⏸️' : '재생 ▶️';
                pad.querySelector('.btn-delete').disabled = !buffers[part] || busy;
                pad.querySelector('.btn-solo').disabled = !buffers[part] || busy;
                const exBtn = pad.querySelector('.btn-example');
                exBtn.disabled = busy;
                exBtn.textContent = examples[part] ? '예시 멈춤 ⏹️' : '예시 듣기 👂';
            });
            // 녹음된 파트가 있으면 루프 길이가 바뀌지 않도록 BPM/길이 잠금
            const locked = any || !!rec;
            bpmSlider.disabled = locked;
            barsSelect.disabled = locked;
            document.getElementById('lockHint').textContent = locked
                ? '🔒 모든 파트의 박자를 맞추기 위해 BPM과 길이가 고정되었습니다. (모든 녹음을 삭제하면 변경 가능)'
                : '녹음을 누르면 "하나, 둘, 셋, 넷" 카운트인 후 녹음이 시작되고, 정해진 길이가 되면 자동으로 끝나요.';
            document.getElementById('btn-download').disabled = !any || !!rec || !!quiz;
            document.getElementById('btn-global-play').disabled = !any || !!rec || !!quiz;
            document.getElementById('btn-quiz').disabled = parts.filter(p => buffers[p]).length < 2 || !!rec || !!quiz;
        }

        function statusText(part) {
            if (rec && rec.part === part) {
                const now = audioCtx.currentTime;
                if (now < rec.startTime) {
                    const beat = Math.floor((now - rec.countInStart) / beatDur()) + 1;
                    return beat >= 1 ? `카운트인 ${beat} / ${BEATS_PER_BAR}` : '준비...';
                }
                const bar = Math.min(bars, Math.floor((now - rec.startTime) / barDur()) + 1);
                return `🔴 녹음 중 ${bar} / ${bars}마디`;
            }
            if (quiz) return buffers[part] ? '❓ 비밀!' : '녹음 전';
            if (examples[part]) return '👂 예시 재생 중 — 카드를 보며 따라 해 보세요';
            if (sources[part]) return '🔁 반복 재생 중';
            if (buffers[part]) return `✅ 녹음 완료 (${bars}마디)`;
            if (!rec && part === nextTurnPart()) return '👉 다음 녹음 차례!';
            return '녹음 전';
        }

        // --- 시각화: 녹음 중에는 실제 마이크 입력, 녹음 후에는 파형과 재생 위치 표시 ---
        function sizeCanvas(canvas) {
            const dpr = window.devicePixelRatio || 1;
            const w = Math.round(canvas.offsetWidth * dpr), h = Math.round(canvas.offsetHeight * dpr);
            if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
        }

        const levelData = new Uint8Array(128);

        function drawPad(part) {
            const canvas = document.getElementById(`canvas-${part}`);
            sizeCanvas(canvas);
            const ctx = canvas.getContext('2d');
            const W = canvas.width, H = canvas.height;
            ctx.clearRect(0, 0, W, H);

            if (rec && rec.part === part && mic) {
                mic.analyser.getByteFrequencyData(levelData);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                const n = 20, gap = 2, barW = W / n - gap;
                for (let i = 0; i < n; i++) {
                    const h = Math.max(2, (levelData[i * 3] / 255) * (H - 6));
                    ctx.fillRect(i * (barW + gap), H - h, barW, h);
                }
                const progress = Math.max(0, Math.min(1, (audioCtx.currentTime - rec.startTime) / loopDur()));
                ctx.fillStyle = 'rgba(231, 76, 60, 0.25)';
                ctx.fillRect(0, 0, W * progress, H);
                return;
            }

            if (peaks[part]) {
                const p = peaks[part], barW = W / p.length;
                ctx.fillStyle = sources[part] ? 'rgba(0, 0, 0, 0.45)' : 'rgba(0, 0, 0, 0.25)';
                for (let i = 0; i < p.length; i++) {
                    const h = Math.max(1, Math.min(1, p[i] * 1.5) * (H - 6));
                    ctx.fillRect(i * barW, (H - h) / 2, Math.max(1, barW - 1), h);
                }
                if (sources[part] && audioCtx) {
                    const pos = ((audioCtx.currentTime - clockOrigin) % loopDur() + loopDur()) % loopDur() / loopDur();
                    ctx.fillStyle = '#e74c3c';
                    ctx.fillRect(W * pos - 1, 0, 2, H);
                }
                return;
            }

            ctx.beginPath();
            ctx.moveTo(0, H / 2);
            ctx.lineTo(W, H / 2);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function render() {
            parts.forEach(part => {
                drawPad(part);
                highlightGuide(part);
                const el = document.querySelector(`#pad-${part} .status`);
                const text = statusText(part);
                if (el.textContent !== text) el.textContent = text;
            });
            requestAnimationFrame(render);
        }

        // --- 아이디어 1: 파트별 "따라 하기 가이드" (음절 카드 + 예시 듣기) ---
        // 한 칸 = 8분음표, 한 마디 = 8칸. 코드 진행은 '작은 별'에 맞춘 C - F - C - G
        const STEPS_PER_BAR = 8;
        const N = { C2: 65.41, F2: 87.31, G2: 98.0, C3: 130.81,
                    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.0, A4: 440.0 };

        const GUIDES = {
            beatbox: {
                tip: '입술을 붙였다 떼며 "북", 혀끝으로 "치", 입술을 터뜨리며 "박"',
                repeatNote: '모든 마디 똑같이 반복해요',
                bars: [{ label: '매 마디', steps: ['북', '치', '박', '치', '북', '북', '박', '치'] }],
                sound: { '북': 'kick', '치': 'hat', '박': 'snare' },
            },
            bass: {
                tip: '입을 다물고 낮고 굵게 "둠" (코로 울리게)',
                bars: [
                    { label: '도 (C)', note: N.C3, steps: ['둠', '', '', '', '둠', '', '둠', ''] },
                    { label: '파 (F)', note: N.F2, steps: ['둠', '', '', '', '둠', '', '둠', ''] },
                    { label: '도 (C)', note: N.C3, steps: ['둠', '', '', '', '둠', '', '둠', ''] },
                    { label: '솔 (G)', note: N.G2, steps: ['둠', '', '', '', '둠', '', '둠', ''] },
                ],
            },
            chorus: {
                tip: '한 마디 동안 "우~" 하고 부드럽게 길게 (숨을 나눠 쉬어요)',
                bars: [
                    { label: '미', note: N.E4, steps: ['우', '~', '~', '~', '~', '~', '~', '~'] },
                    { label: '파', note: N.F4, steps: ['우', '~', '~', '~', '~', '~', '~', '~'] },
                    { label: '미', note: N.E4, steps: ['우', '~', '~', '~', '~', '~', '~', '~'] },
                    { label: '레', note: N.D4, steps: ['우', '~', '~', '~', '~', '~', '~', '~'] },
                ],
            },
            melody: {
                tip: '"작은 별"을 한 박에 한 글자씩 또박또박',
                bars: [
                    { label: '도도솔솔', notes: [N.C4, N.C4, N.G4, N.G4], steps: ['반', '', '짝', '', '반', '', '짝', ''] },
                    { label: '라라솔', notes: [N.A4, N.A4, N.G4], steps: ['작', '', '은', '', '별', '~', '~', '~'] },
                    { label: '파파미미', notes: [N.F4, N.F4, N.E4, N.E4], steps: ['아', '', '름', '', '답', '', '게', ''] },
                    { label: '레레도', notes: [N.D4, N.D4, N.C4], steps: ['비', '', '치', '', '네', '~', '~', '~'] },
                ],
            },
        };

        const guideState = {};   // part -> { cells: [[el...]], lastKey }
        const examples = {};     // part -> { start, barOffset, nodes, timer }

        function buildGuides() {
            parts.forEach(part => {
                const g = GUIDES[part];
                const box = document.getElementById(`guide-${part}`);
                const rowsShown = g.bars.length === 1 ? 1 : Math.min(bars, g.bars.length);
                let html = `<div class="guide-tip">💬 ${g.tip}</div>`;
                for (let r = 0; r < rowsShown; r++) {
                    const bar = g.bars[r];
                    html += `<div class="guide-row"><span class="guide-label">${bar.label}</span><div class="guide-cells">` +
                        bar.steps.map((t, i) =>
                            `<div class="guide-cell${t ? '' : ' rest'}${i % 2 === 0 ? ' beat' : ''}">${t || '·'}</div>`
                        ).join('') + '</div></div>';
                }
                const note = g.repeatNote || (bars > rowsShown ? `${rowsShown}마디를 반복해요` : '');
                if (note) html += `<div class="guide-note">🔁 ${note}</div>`;
                box.innerHTML = html;
                guideState[part] = {
                    cells: [...box.querySelectorAll('.guide-cells')].map(row => [...row.children]),
                    lastKey: null,
                };
            });
        }

        // 지금 몇 번째 칸인지 계산 (예시 재생, 녹음, 반복 재생 중일 때)
        function currentGuideCell(part) {
            if (!audioCtx) return null;
            const now = audioCtx.currentTime;
            const stepDur = beatDur() / 2;
            let pos, barOffset = 0;
            if (examples[part]) { pos = now - examples[part].start; barOffset = examples[part].barOffset; }
            else if (rec) pos = now - rec.startTime;
            else if (transportRunning) pos = now - clockOrigin;
            else return null;
            if (pos < 0) return null;
            const step = Math.floor(pos / stepDur) % (bars * STEPS_PER_BAR);
            const barInLoop = (Math.floor(step / STEPS_PER_BAR) + barOffset) % bars;
            const rows = guideState[part].cells.length;
            return { row: barInLoop % rows, cell: step % STEPS_PER_BAR };
        }

        function highlightGuide(part) {
            const st = guideState[part];
            if (!st) return;
            const c = currentGuideCell(part);
            const key = c ? `${c.row}-${c.cell}` : null;
            if (key === st.lastKey) return;
            if (st.lastKey) {
                const [r, i] = st.lastKey.split('-').map(Number);
                st.cells[r][i].classList.remove('now');
            }
            if (c) st.cells[c.row][c.cell].classList.add('now');
            st.lastKey = key;
        }

        // 예시 소리 합성 (가이드 소리는 믹스·다운로드에 들어가지 않음)
        let noiseBuffer = null;
        function getNoise() {
            if (!noiseBuffer) {
                noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.5, audioCtx.sampleRate);
                const d = noiseBuffer.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            }
            return noiseBuffer;
        }

        function envelope(gainNode, t, peak, attack, dur) {
            gainNode.gain.setValueAtTime(0.0001, t);
            gainNode.gain.exponentialRampToValueAtTime(peak, t + attack);
            gainNode.gain.setValueAtTime(peak, t + Math.max(attack, dur - 0.05));
            gainNode.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        }

        function synthDrum(type, t, out) {
            const g = audioCtx.createGain();
            g.connect(out);
            if (type === 'kick') {
                const osc = audioCtx.createOscillator();
                osc.frequency.setValueAtTime(150, t);
                osc.frequency.exponentialRampToValueAtTime(45, t + 0.12);
                g.gain.setValueAtTime(1, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
                osc.connect(g); osc.start(t); osc.stop(t + 0.26);
                return osc;
            }
            const src = audioCtx.createBufferSource();
            src.buffer = getNoise();
            const f = audioCtx.createBiquadFilter();
            f.type = type === 'hat' ? 'highpass' : 'bandpass';
            f.frequency.value = type === 'hat' ? 7000 : 1800;
            const len = type === 'hat' ? 0.05 : 0.15;
            g.gain.setValueAtTime(type === 'hat' ? 0.5 : 0.8, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + len);
            src.connect(f); f.connect(g); src.start(t); src.stop(t + len + 0.01);
            return src;
        }

        function synthNote(freq, t, dur, wave, out, attack, vibrato) {
            const osc = audioCtx.createOscillator();
            osc.type = wave;
            osc.frequency.value = freq;
            const g = audioCtx.createGain();
            envelope(g, t, 0.35, attack, dur);
            osc.connect(g); g.connect(out);
            if (vibrato) {
                const lfo = audioCtx.createOscillator(), depth = audioCtx.createGain();
                lfo.frequency.value = 5; depth.gain.value = freq * 0.01;
                lfo.connect(depth); depth.connect(osc.frequency);
                lfo.start(t); lfo.stop(t + dur);
            }
            osc.start(t); osc.stop(t + dur + 0.01);
            return osc;
        }

        function scheduleGuideBar(part, barIndex, t, out, nodes) {
            const g = GUIDES[part];
            const bar = g.bars[barIndex % g.bars.length];
            const step = beatDur() / 2;
            if (part === 'beatbox') {
                bar.steps.forEach((syl, i) => { if (g.sound[syl]) nodes.push(synthDrum(g.sound[syl], t + i * step, out)); });
            } else if (part === 'bass') {
                bar.steps.forEach((syl, i) => {
                    if (!syl) return;
                    let len = 1; while (i + len < STEPS_PER_BAR && !bar.steps[i + len]) len++;
                    nodes.push(synthNote(bar.note, t + i * step, len * step * 0.9, 'triangle', out, 0.01, false));
                });
            } else if (part === 'chorus') {
                nodes.push(synthNote(bar.note, t, STEPS_PER_BAR * step * 0.97, 'sine', out, 0.08, true));
            } else {
                let n = 0;
                bar.steps.forEach((syl, i) => {
                    if (!syl || syl === '~') return;
                    let len = 1; while (i + len < STEPS_PER_BAR && (!bar.steps[i + len] || bar.steps[i + len] === '~')) len++;
                    nodes.push(synthNote(bar.notes[n++], t + i * step, len * step * 0.9, 'triangle', out, 0.02, false));
                });
            }
        }

        function stopExample(part) {
            const ex = examples[part];
            if (!ex) return;
            clearTimeout(ex.timer);
            ex.nodes.forEach(n => { try { n.stop(); } catch (e) {} });
            ex.out.disconnect();
            delete examples[part];
            updateUI();
        }

        // 예시 듣기: 반복 재생 중이면 다음 마디 시작에 맞춰 함께 들려줌
        function toggleExample(part) {
            if (rec) return;
            initAudioCtx();
            if (examples[part]) { stopExample(part); return; }
            let start = audioCtx.currentTime + 0.05, barOffset = 0;
            if (transportRunning) {
                const barsFromOrigin = Math.ceil((start - clockOrigin) / barDur());
                start = clockOrigin + barsFromOrigin * barDur();
                barOffset = ((barsFromOrigin % bars) + bars) % bars;
            }
            const out = audioCtx.createGain();
            out.gain.value = 0.7;
            out.connect(audioCtx.destination);
            const nodes = [];
            for (let b = 0; b < bars; b++) scheduleGuideBar(part, (barOffset + b) % bars, start + b * barDur(), out, nodes);
            examples[part] = {
                start, barOffset, nodes, out,
                timer: setTimeout(() => stopExample(part), (start - audioCtx.currentTime + loopDur()) * 1000 + 200),
            };
            updateUI();
        }

        function stopAllExamples() {
            Object.keys(examples).forEach(stopExample);
        }

        // --- 아이디어 3: 레이어 쌓기 릴레이 & 솔로 & 빠진 파트 찾기 퀴즈 ---
        function nextTurnPart() {
            return parts.find(p => !buffers[p]) || null;
        }

        // 솔로: 이 파트만 남기고 나머지 파트는 끔 (반복 박자는 유지)
        function soloTrack(part) {
            if (!buffers[part] || rec || quiz) return;
            initAudioCtx();
            parts.forEach(p => { if (p !== part) stopSource(p); });
            if (!sources[part]) {
                if (transportRunning) {
                    const when = audioCtx.currentTime + 0.02;
                    startSource(part, when, ((when - clockOrigin) % loopDur() + loopDur()) % loopDur());
                } else {
                    startTransport(audioCtx.currentTime + 0.05, [part]);
                }
            }
            updateUI();
        }

        const PART_NAMES = { beatbox: '🥁 비트박스', bass: '🎸 베이스', chorus: '👥 화음', melody: '🎵 멜로디' };
        let quiz = null;   // { answer, tried: Set, solved }
        let quizScore = { right: 0, total: 0, streak: 0 };

        function startQuiz() {
            if (rec || parts.filter(p => buffers[p]).length < 2) return;
            quizScore = { right: 0, total: 0, streak: 0 };
            document.body.classList.add('quiz-mode');
            document.getElementById('quiz').classList.add('active');
            nextQuestion();
            document.getElementById('quiz').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function nextQuestion() {
            initAudioCtx();
            stopAllExamples();
            const recorded = parts.filter(p => buffers[p]);
            let answer;
            do { answer = recorded[Math.floor(Math.random() * recorded.length)]; }
            while (quiz && recorded.length > 1 && answer === quiz.answer && Math.random() < 0.7);
            quiz = { answer, tried: new Set(), solved: false };

            stopTransport();
            startTransport(audioCtx.currentTime + 0.05, recorded.filter(p => p !== answer));

            document.getElementById('quiz-msg').textContent = '잘 들어보세요! 어떤 파트가 빠졌을까요? 🤔';
            document.getElementById('quiz-options').innerHTML = recorded.map(p =>
                `<button style="background: var(--${p}-bg)" onclick="answerQuiz('${p}', this)">${PART_NAMES[p]}</button>`
            ).join('');
            document.getElementById('quiz-next').disabled = true;
            renderQuizScore();
            updateUI();
        }

        function answerQuiz(part, btn) {
            if (!quiz || quiz.solved || quiz.tried.has(part)) return;
            quiz.tried.add(part);
            const msg = document.getElementById('quiz-msg');
            if (part === quiz.answer) {
                quiz.solved = true;
                if (quiz.tried.size === 1) { quizScore.right++; quizScore.streak++; } else quizScore.streak = 0;
                quizScore.total++;
                btn.classList.add('right');
                msg.textContent = `정답! 🎉 ${PART_NAMES[part]} 파트가 빠져 있었어요. 이제 모두 함께 들어볼까요?`;
                // 정답 공개: 빠진 파트를 박자에 맞춰 다시 넣어 줌
                const when = audioCtx.currentTime + 0.02;
                startSource(part, when, ((when - clockOrigin) % loopDur() + loopDur()) % loopDur());
                document.getElementById('quiz-options').querySelectorAll('button').forEach(b => b.disabled = true);
                document.getElementById('quiz-next').disabled = false;
            } else {
                btn.disabled = true;
                btn.classList.add('wrong');
                msg.textContent = `${PART_NAMES[part]} 파트는 들리고 있어요! 다시 들어보세요 👂`;
            }
            renderQuizScore();
        }

        function renderQuizScore() {
            const s = quizScore;
            document.getElementById('quiz-score').textContent =
                `한 번에 맞힌 문제 ${s.right} / ${s.total}` + (s.streak >= 2 ? `  ·  🔥 ${s.streak}연속 정답!` : '');
        }

        function endQuiz() {
            if (!quiz) return;
            quiz = null;
            document.body.classList.remove('quiz-mode');
            document.getElementById('quiz').classList.remove('active');
            stopTransport();
            updateUI();
        }

        // --- WAV 믹스다운 ---
        async function downloadMix() {
            const activeParts = parts.filter(p => buffers[p]);
            if(activeParts.length === 0) {
                alert("녹음된 파트가 없습니다. 먼저 녹음을 진행해주세요!");
                return;
            }

            initAudioCtx();
            const btn = document.getElementById('btn-download');
            btn.textContent = "믹스다운 중... ⏳";
            btn.disabled = true;

            try {
                const sr = audioCtx.sampleRate;
                const total = loopDur() * MIX_REPEATS;
                const offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(
                    2, Math.ceil(sr * total), sr
                );
                const comp = offlineCtx.createDynamicsCompressor();
                comp.threshold.value = -6;
                comp.ratio.value = 8;
                comp.connect(offlineCtx.destination);

                for(const part of activeParts) {
                    const source = offlineCtx.createBufferSource();
                    source.buffer = buffers[part];
                    source.loop = true;

                    const gainNode = offlineCtx.createGain();
                    gainNode.gain.value = document.getElementById(`vol-${part}`).value;

                    source.connect(gainNode);
                    gainNode.connect(comp);
                    source.start(0);
                    source.stop(total);
                }

                const renderedBuffer = await offlineCtx.startRendering();
                const wavBlob = audioBufferToWav(renderedBuffer);

                const url = URL.createObjectURL(wavBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `아카펠라_완성곡_${new Date().getTime()}.wav`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                // 사파리는 다운로드가 시작되기 전에 URL을 해제하면 실패하므로 잠시 후 해제
                setTimeout(() => URL.revokeObjectURL(url), 10000);

            } catch(e) {
                console.error("믹스다운 오류:", e);
                alert("음원 생성 중 오류가 발생했습니다. 트랙을 다시 녹음해보세요.");
            } finally {
                btn.textContent = "음원(.wav) 다운로드 💾";
                updateUI();
            }
        }

        function audioBufferToWav(buffer) {
            let numOfChan = buffer.numberOfChannels,
                length = buffer.length * numOfChan * 2 + 44,
                bufferArray = new ArrayBuffer(length),
                view = new DataView(bufferArray),
                channels = [], i, sample,
                offset = 0, pos = 0;

            function setUint16(data) { view.setUint16(offset, data, true); offset += 2; }
            function setUint32(data) { view.setUint32(offset, data, true); offset += 4; }

            setUint32(0x46464952);                          // "RIFF"
            setUint32(length - 8);                          // 파일 크기 - 8
            setUint32(0x45564157);                          // "WAVE"
            setUint32(0x20746d66);                          // "fmt "
            setUint32(16);
            setUint16(1);                                   // PCM
            setUint16(numOfChan);
            setUint32(buffer.sampleRate);
            setUint32(buffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2);
            setUint16(16);
            setUint32(0x61746164);                          // "data"
            setUint32(length - 44);                         // 오디오 데이터 크기

            for(i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

            while(pos < buffer.length) {
                for(i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][pos]));
                    sample = (sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    view.setInt16(offset, sample, true);
                    offset += 2;
                }
                pos++;
            }
            return new Blob([bufferArray], {type: "audio/wav"});
        }

        // --- 새로고침해도 녹음이 사라지지 않도록 브라우저(IndexedDB)에 임시 저장 ---
        let dbPromise = null;

        function openDB() {
            if (!dbPromise) {
                dbPromise = new Promise((resolve, reject) => {
                    if (!window.indexedDB) return reject(new Error('IndexedDB 미지원'));
                    const req = indexedDB.open('acapella-looper', 1);
                    req.onupgradeneeded = () => {
                        req.result.createObjectStore('tracks');
                        req.result.createObjectStore('settings');
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            }
            return dbPromise;
        }

        async function dbRun(store, fn) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(store, 'readwrite');
                const req = fn(tx.objectStore(store));
                tx.oncomplete = () => resolve(req && req.result);
                tx.onerror = () => reject(tx.error);
            });
        }

        let unsavedWork = false;   // 저장에 실패하면 페이지를 떠날 때 경고

        function dbSave(part, data, sampleRate) {
            dbRun('tracks', s => s.put({ data, sampleRate }, part))
                .then(() => saveSettings())
                .catch(e => { console.warn('녹음 임시 저장 실패', e); unsavedWork = true; });
        }

        function dbDelete(part) {
            dbRun('tracks', s => s.delete(part)).catch(() => {});
        }

        function saveSettings() {
            dbRun('settings', s => s.put({ bpm, bars }, 'main')).catch(() => {});
        }

        async function restoreSession() {
            try {
                const settings = await dbRun('settings', s => s.get('main'));
                if (settings) {
                    bpm = settings.bpm; bars = settings.bars;
                    bpmSlider.value = bpm; bpmValue.textContent = bpm; barsSelect.value = bars;
                }
                for (const part of parts) {
                    const saved = await dbRun('tracks', s => s.get(part));
                    if (!saved) continue;
                    if (!audioCtx) initAudioCtx();
                    const buffer = audioCtx.createBuffer(1, saved.data.length, saved.sampleRate);
                    buffer.copyToChannel(saved.data, 0);
                    setTrack(part, buffer);
                }
            } catch (e) {
                console.warn('이전 녹음 불러오기 실패', e);
            }
            buildGuides();
            updateUI();
        }

        window.addEventListener('beforeunload', (e) => {
            if (rec || (unsavedWork && hasAnyTrack())) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        window.onload = () => {
            if (!isSupported) document.getElementById('unsupported').style.display = 'block';
            buildGuides();
            updateUI();
            restoreSession();
            requestAnimationFrame(render);
        }
    </script>
</body>
